<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시술 기록 · 포트폴리오</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1f8;--card:#fff;--ink:#241f35;--sub:#6f6a85;--line:#e1ddee;--ac:#5b3fb5;--acs:#ebe6fa;--aci:#fff;--sh:0 6px 20px rgba(60,40,120,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131f;--card:#201d2e;--ink:#efedf8;--sub:#a29cbc;--line:#322e45;--ac:#a99bff;--acs:#2c2745;--aci:#15131f;--sh:none}}
:root[data-theme="dark"]{--bg:#15131f;--card:#201d2e;--ink:#efedf8;--sub:#a29cbc;--line:#322e45;--ac:#a99bff;--acs:#2c2745;--aci:#15131f;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;line-height:1.55}
main{max-width:560px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:24px;font-weight:700;margin:4px 0 2px;letter-spacing:-.02em}
.hint{color:var(--sub);font-size:13px;margin:0 0 16px}
.tabs{display:flex;gap:6px;background:var(--acs);padding:5px;border-radius:14px;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;background:transparent;color:var(--sub);padding:10px 4px;border-radius:10px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ac);box-shadow:var(--sh)}
section[hidden]{display:none}
form,.card,.sum{background:var(--card);border-radius:18px;box-shadow:var(--sh);border:1px solid var(--line)}
form{display:grid;gap:12px;padding:16px}
label{font-size:13px;color:var(--sub);display:grid;gap:5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%}
textarea{min-height:72px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=color]{height:44px;padding:3px}
button{font:inherit;border:0;border-radius:12px;padding:13px;background:var(--ac);color:var(--aci);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--sub);padding:4px 6px;font-weight:400;font-size:13px}
#pv{max-height:160px;border-radius:12px;object-fit:cover;display:none}
.sum{padding:16px;margin-bottom:14px;display:grid;gap:6px}
.sum .big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.sum .line{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--sub)}
.sum input{width:84px;text-align:right}.sum strong{color:var(--ink)}
.search{margin-bottom:12px}
.list{display:grid;gap:12px}
.card{display:grid;grid-template-columns:auto 1fr;overflow:hidden}
.th{width:96px;background-size:cover;background-position:center;position:relative}
.th i{position:absolute;left:8px;bottom:8px;width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.body{padding:12px 14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:700}.date{color:var(--sub);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}
.chip{font-size:12px;background:var(--acs);color:var(--ac);border-radius:99px;padding:2px 10px;border:0;font-weight:600}
.chip.on{background:var(--ac);color:var(--aci)}
.amt{font-weight:700;font-size:14px}
.recipe,.memo{white-space:pre-wrap;font-size:14px;margin:3px 0}.memo{color:var(--sub);font-size:13px}
.empty{text-align:center;color:var(--sub);padding:30px 8px;border:1px dashed var(--line);border-radius:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{aspect-ratio:3/4;border-radius:16px;background-size:cover;background-position:center;position:relative;overflow:hidden;padding:0;border:0}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;color:#fff;font-size:13px;font-weight:600;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.6))}
#ov{position:fixed;inset:0;background:rgba(15,10,30,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#ov .box{background:var(--card);border-radius:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto;padding:12px}
#ov img{width:100%;border-radius:14px;display:block}
.btns{display:flex;gap:8px}.btns button{flex:1;padding:10px}
details{margin-top:22px;color:var(--sub);font-size:13px}details textarea{margin:8px 0;min-height:90px}
</style>
</head>
<body>
<main>
<h1>시술 기록 · 포트폴리오</h1>
<p class="hint">고객 실명 대신 별명으로 적어주세요. 기록은 이 기기에만 저장돼요.</p>
<nav class="tabs" role="tablist">
<button role="tab" data-t="new" aria-selected="true">기록하기</button>
<button role="tab" data-t="list" aria-selected="false">기록 목록</button>
<button role="tab" data-t="port" aria-selected="false">포트폴리오</button>
</nav>

<section id="v-new">
<form id="f">
<div class="row"><label>고객 별명<input id="name" required maxlength="20" placeholder="예: 단발 J"></label>
<label>시술일<input id="date" type="date" required></label></div>
<div class="row"><label>시술 종류<select id="kind"><option>염색</option><option>탈색</option><option>펌</option><option>커트</option><option>클리닉</option><option>기타</option></select></label>
<label>금액(원)<input id="amount" type="number" min="0" step="1000" inputmode="numeric" placeholder="80000"></label></div>
<input id="kindEtc" maxlength="20" placeholder="시술 종류를 직접 입력 (예: 두피 케어)" aria-label="기타 시술 종류" hidden>
<label>완성 사진 (얼굴이 안 나오는 컷 권장)<input id="photo" type="file" accept="image/*"></label>
<img id="pv" alt="사진 미리보기">
<label>태그 (쉼표로 구분)<input id="tags" placeholder="단발, 레이어드, 애쉬브라운"></label>
<label>배합 · 레시피<textarea id="recipe" placeholder="6레벨 애쉬 + 7레벨 브라운 1:1, 산화제 6% 1.5배, 30분"></textarea></label>
<label>메모<textarea id="memo" placeholder="모발 끝 손상 있음. 다음엔 트리트먼트 먼저"></textarea></label>
<label>색상 칩<input id="color" type="color" value="#7a5c4a"></label>
<button type="submit">기록 저장</button>
</form>
</section>

<section id="v-list" hidden>
<div class="sum" aria-live="polite"><div class="line" id="mlabel">이번 달 매출</div><div class="big" id="msum">0원</div>
<div class="line"><span>내 인센티브 비율(%)</span><input id="rate" type="number" min="0" max="100" placeholder="예: 10"></div>
<div class="line"><span>이번 달 예상 인센티브</span><strong id="minc">-</strong></div></div>
<input class="search" id="q" type="search" placeholder="별명·레시피·태그로 검색" aria-label="검색">
<div class="list" id="list"></div>
<details><summary>백업 · 복원 (폰을 바꾸기 전에 꼭!)</summary>
<textarea id="bk" placeholder="내보내기를 누르면 백업 글자가 나와요. 복사해서 카톡 나와의 채팅에 보관하세요."></textarea>
<div class="btns"><button type="button" id="exp">내보내기</button><button type="button" id="imp">가져오기</button></div></details>
</section>

<section id="v-port" hidden>
<div class="chips" id="tagbar"></div>
<div class="grid" id="grid"></div>
</section>
</main>
<div id="ov"><div class="box" id="box"></div></div>

<script>
const KEY="sulsul-records",RK="sulsul-rate",$=id=>document.getElementById(id);
let records=[],ptag="";
try{records=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
try{$("rate").value=localStorage.getItem(RK)||""}catch(e){}
$("date").valueAsDate=new Date();
const won=n=>Number(n||0).toLocaleString("ko-KR")+"원";
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function save(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){alert("저장 공간이 가득 찼어요. 오래된 사진 기록을 지우거나 백업해 주세요.");return false}}

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["new","list","port"].forEach(k=>$("v-"+k).hidden=k!==b.dataset.t);
  render();
});

$("kind").onchange=()=>{$("kindEtc").hidden=$("kind").value!=="기타"};
let photoData="";
$("photo").onchange=e=>{
  const f=e.target.files[0];photoData="";$("pv").style.display="none";if(!f)return;
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{const m=900,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    photoData=c.toDataURL("image/jpeg",.7);$("pv").src=photoData;$("pv").style.display="block";URL.revokeObjectURL(u)};
  img.src=u;
};

$("f").onsubmit=e=>{
  e.preventDefault();
  const tags=$("tags").value.split(",").map(t=>t.trim()).filter(Boolean);
  records.unshift({id:Date.now(),name:$("name").value.trim(),date:$("date").value,kind:($("kind").value==="기타"&&$("kindEtc").value.trim())?$("kindEtc").value.trim():$("kind").value,amount:$("amount").value,tags,photo:photoData,recipe:$("recipe").value.trim(),memo:$("memo").value.trim(),color:$("color").value});
  if(!save()){records.shift();return}
  ["name","amount","tags","recipe","memo","photo","kindEtc"].forEach(i=>$(i).value="");photoData="";$("pv").style.display="none";
  alert("저장했어요. '기록 목록'에서 확인해보세요.");
};

function summary(){
  const n=new Date(),ym=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");
  const s=records.filter(r=>(r.date||"").startsWith(ym)).reduce((a,r)=>a+(Number(r.amount)||0),0),rt=parseFloat($("rate").value);
  $("mlabel").textContent=(n.getMonth()+1)+"월 매출";$("msum").textContent=won(s);
  $("minc").textContent=isNaN(rt)?"비율을 입력하세요":won(Math.round(s*rt/100));
}
function del(r){if(confirm("이 기록을 삭제할까요?")){records=records.filter(x=>x.id!==r.id);save();render()}}

function renderList(){
  summary();
  const q=$("q").value.trim().toLowerCase(),L=$("list");L.textContent="";
  const items=records.filter(r=>!q||(r.name+r.recipe+r.memo+r.kind+(r.tags||[]).join(" ")).toLowerCase().includes(q));
  if(!items.length){L.append(el("div","empty",records.length?"검색 결과가 없어요.":"아직 기록이 없어요. '기록하기'에서 첫 기록을 남겨보세요."));return}
  items.forEach(r=>{
    const c=el("div","card"),th=el("div","th");
    if(r.photo)th.style.backgroundImage="url("+r.photo+")";else th.style.background=r.color;
    const dot=el("i");dot.style.background=r.color;th.append(dot);
    const b=el("div","body"),top=el("div","top");
    top.append(el("span","name",r.name),el("span","date",r.date));
    const ch=el("div","chips");ch.append(el("span","chip",r.kind));(r.tags||[]).forEach(t=>ch.append(el("span","chip",t)));
    const d=el("button","ghost","삭제");d.type="button";d.onclick=()=>del(r);
    b.append(top,ch);if(r.amount)b.append(el("div","amt",won(r.amount)));
    b.append(el("div","recipe",r.recipe),el("div","memo",r.memo),d);c.append(th,b);L.append(c);
  });
}

function renderPort(){
  const ph=records.filter(r=>r.photo),tags=[...new Set(ph.flatMap(r=>r.tags||[]))];
  const bar=$("tagbar");bar.textContent="";
  [["","전체"],...tags.map(t=>[t,t])].forEach(([v,l])=>{const b=el("button","chip"+(ptag===v?" on":""),l);b.type="button";b.onclick=()=>{ptag=v;renderPort()};bar.append(b)});
  const g=$("grid");g.textContent="";
  const items=ph.filter(r=>!ptag||(r.tags||[]).includes(ptag));
  if(!items.length){const e=el("div","empty","사진이 있는 기록이 포트폴리오에 모여요. 기록할 때 완성 사진을 붙여보세요.");e.style.gridColumn="1/-1";g.append(e);return}
  items.forEach(r=>{const t=el("button","tile");t.type="button";t.style.backgroundImage="url("+r.photo+")";
    t.append(el("span",null,r.kind+((r.tags||[])[0]?" · "+r.tags[0]:"")));t.onclick=()=>openDetail(r);g.append(t)});
}
function openDetail(r){
  const bx=$("box");bx.textContent="";const im=el("img");im.src=r.photo;im.alt=r.kind;
  const ch=el("div","chips");ch.append(el("span","chip",r.kind));(r.tags||[]).forEach(t=>ch.append(el("span","chip",t)));
  const cl=el("button",null,"닫기");cl.type="button";cl.style.width="100%";cl.style.marginTop="8px";cl.onclick=()=>$("ov").style.display="none";
  bx.append(im,ch,el("div","recipe",r.recipe),el("div","memo",r.memo),cl);$("ov").style.display="flex";
}
$("ov").onclick=e=>{if(e.target===$("ov"))$("ov").style.display="none"};
function render(){renderList();renderPort()}

$("q").oninput=renderList;
$("rate").oninput=()=>{try{localStorage.setItem(RK,$("rate").value)}catch(e){}summary()};
$("exp").onclick=()=>{$("bk").value=JSON.stringify(records);$("bk").select()};
$("imp").onclick=()=>{try{const d=JSON.parse($("bk").value);if(!Array.isArray(d))throw 0;
  if(confirm("지금 기록을 이 백업으로 바꿀까요?")){records=d;save();render()}}catch(e){alert("백업 글자가 올바르지 않아요. 내보내기로 만든 글자를 그대로 붙여넣어 주세요.")}};
render();
</script>
</body>
</html>
